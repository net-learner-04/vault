<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Vault</title>
  <link rel="icon" href="icon.png"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="auth-desktop">
    <div class="win-window auth-window">
      <div class="win-titlebar">
        <img class="title-icon" src="icon.png" alt=""/>
        <span class="title-text">Reset Password</span>
        <div class="win-title-controls">
          <button class="win-title-btn">_</button><button class="win-title-btn">□</button><button class="win-title-btn">✕</button>
        </div>
      </div>

      <div class="modal-body">
        <div id="step1">
          <h1 class="auth-heading">Reset password</h1>
          <p class="auth-sub">Enter your email to receive a verification code.</p>
          <div id="alert1" class="alert"></div>
          <div class="form-stack">
            <div class="form-row">
              <label for="email">Email address</label>
              <input class="win-input" type="email" id="email" placeholder="your@email.com"/>
            </div>
            <button class="win-btn win-btn-primary" id="sendBtn">Send Code</button>
          </div>
        </div>

        <div id="step2" style="display:none;">
          <h1 class="auth-heading">Enter code</h1>
          <p class="auth-sub">Check your inbox for the 6-digit verification code.</p>
          <div id="alert2" class="alert"></div>
          <div class="form-stack">
            <div class="form-row">
              <label for="code">Verification code</label>
              <input class="win-input" type="text" id="code" placeholder="000000" maxlength="6" style="text-align:center;letter-spacing:0.3em;font-size:16px;font-weight:bold;"/>
            </div>
            <div class="form-row">
              <label for="newPass">New password</label>
              <input class="win-input" type="password" id="newPass" placeholder="Enter new password"/>
            </div>
            <div class="form-row">
              <label for="newPass2">Confirm new password</label>
              <input class="win-input" type="password" id="newPass2" placeholder="Repeat new password"/>
            </div>
            <div class="form-hint">🔐 Your files stay safe: the admin recovery key restores access after a reset.</div>
            <button class="win-btn win-btn-primary" id="resetBtn">Reset Password</button>
            <button class="win-btn" id="backBtn">← Back</button>
          </div>
        </div>

        <div class="auth-footer"><a href="login.html">← Back to sign in</a></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let emailVal = "";

    document.getElementById("sendBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const a = document.getElementById("alert1");
      if (!email) { showAlert(a, "Please enter your email."); return; }
      const btn = document.getElementById("sendBtn");
      btn.textContent = "Sending..."; btn.disabled = true; hideAlert(a);
      const res = await fetch(`${API}/api/user/password/reset-request?email=${encodeURIComponent(email)}`, {method: "POST"});
      const d = await res.json();
      if (res.ok) {
        emailVal = email;
        document.getElementById("step1").style.display = "none";
        document.getElementById("step2").style.display = "block";
      } else {
        showAlert(a, d.detail || "Email not found.");
        btn.textContent = "Send Code"; btn.disabled = false;
      }
    });

    document.getElementById("resetBtn").addEventListener("click", async () => {
      const code = document.getElementById("code").value.trim();
      const newPass = document.getElementById("newPass").value;
      const newPass2 = document.getElementById("newPass2").value;
      const a = document.getElementById("alert2");
      if (!code || !newPass || !newPass2) { showAlert(a, "Please fill in all fields."); return; }
      if (newPass !== newPass2) { showAlert(a, "Passwords do not match."); return; }
      if (newPass.length < 6) { showAlert(a, "Password must be at least 6 characters."); return; }

      const btn = document.getElementById("resetBtn");
      btn.textContent = "Resetting..."; btn.disabled = true; hideAlert(a);
      const res = await fetch(`${API}/api/user/password/reset`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email: emailVal, code, new_password: newPass, new_password2: newPass2})
      });
      const d = await res.json();
      if (res.ok) {
        showAlert(a, "Password reset! Redirecting...", "success");
        setTimeout(() => window.location.href = "login.html", 1500);
      } else {
        showAlert(a, d.detail || "Invalid or expired code.");
        btn.textContent = "Reset Password"; btn.disabled = false;
      }
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      document.getElementById("step2").style.display = "none";
      document.getElementById("step1").style.display = "block";
    });
  </script>
</body>
</html>
